spring:
  application:
    name: procureflow-ai
  profiles:
    # 미지정 시 local. 운영은 SPRING_PROFILES_ACTIVE=prd 로 명시한다.
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 관리한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# 운영에서는 비활성. local 등 개발 프로파일에서만 켠다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 운영에서는 비활성. p6spy는 local에서만 켠다 (파라미터 치환 SQL 로그).
decorator:
  datasource:
    p6spy:
      enable-logging: false
