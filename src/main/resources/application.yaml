spring:
  application:
    name: procureflow-ai
  profiles:
    # 미지정 시 local. 운영은 SPRING_PROFILES_ACTIVE=prd 로 명시한다.
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

# 운영에서는 비활성. local 등 개발 프로파일에서만 켠다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
